<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulación de la tasa de consumo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="marco">
    <aside>
      <h2>Tus datos</h2>
      <label for="modelo">Modelo</label>
      <select id="modelo"></select>
      <span class="etiqueta">Definir el horizonte</span>
      <div class="fila">
        <label class="fila"><input type="radio" name="modo" value="meses" checked> Meses</label>
        <label class="fila"><input type="radio" name="modo" value="fecha"> Fecha final</label>
      </div>
      <div id="bloque-meses">
        <label for="horizonte">Meses hacia adelante</label>
        <div class="deslizador">
          <output id="horizonte-valor" for="horizonte">12</output>
          <input id="horizonte" type="range" min="1" max="24" value="12">
        </div>
      </div>
      <div id="bloque-fecha" hidden>
        <label for="fecha-final">Fecha final de la proyección</label>
        <input id="fecha-final" type="date" value="2027-09-30" min="2026-10-31" max="2028-09-30">
        <p class="nota" id="equivale"></p>
      </div>
      <span class="etiqueta">Rango del historial</span>
      <div class="extremos"><span id="desde-etiq"></span><span id="hasta-etiq"></span></div>
      <div class="doble" id="doble">
        <span class="relleno" id="relleno"></span>
        <input id="desde-idx" type="range" min="0" value="0">
        <input id="hasta-idx" type="range" min="0" value="0">
      </div>
      <label class="fila"><input id="politica" type="checkbox" checked> Superponer la tasa de política</label>
      <span class="etiqueta">Agregados en el historial</span>
      <div class="fila">
        <label class="fila"><input type="radio" name="vista" value="niveles" checked> Niveles</label>
        <label class="fila"><input type="radio" name="vista" value="crecimiento"> Crecimiento anual</label>
      </div>
      <p class="nota">El rango y la vista no cambian tu proyección.</p>
    </aside>
    <main>
      <h1>Simulación de la tasa de consumo</h1>
      <span class="etiqueta">Sección</span>
      <div class="secciones" id="secciones">
        <label class="fila"><input type="radio" name="seccion" value="historial" checked> Historial</label>
        <label class="fila"><input type="radio" name="seccion" value="proyeccion"> Proyección</label>
        <label class="fila"><input type="radio" name="seccion" value="desempeno"> Desempeño</label>
        <label class="fila"><input type="radio" name="seccion" value="estudio"> Estudio</label>
      </div>
      <div id="contenido"></div>
      <p class="pie">Proyección estadística. No es asesoría financiera.</p>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
  <script src="datos.js"></script>
  <script src="app.js"></script>
</body>
</html>
